
[project]
name = "entirius-django-notifications"
version = "0.1.0"
description = "In-app, email and Google Chat notifications with escalation for the Volkanos platform"
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski", email = "piotrb@entirius.com" },
    { name = "Paweł Kiełt", email = "cptshooter12@gmail.com" },
    { name = "Mateusz Baran", email = "mateuszbaranpv@gmail.com" },
    { name = "Michał Kloczkowski", email = "michal@kloczkowski.pl" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "pydantic>=2.0",
    "celery>=5.3",
    "entirius-django-utils>=2.0.0",
    "entirius-django-regional>=2.0.1",
    "entirius-py-idx-normalizator>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
# Soft dependencies: email / Google Chat deliveries are skipped with a warning when absent.
email = ["entirius-django-email>=4.0.1"]
googlechat = ["entirius-py-googlechat>=0.1.0"]
# The suite exercises both soft dependencies, so `test` pulls them in: `uv sync --extra test` suffices.
test = [
    "pytest",
    "pytest-django",
    "factory-boy",
    "respx",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.0",
    "entirius-django-email>=4.0.1",
    "entirius-py-googlechat>=0.1.0",
]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-notifications"

# entirius-py-googlechat is not on PyPI until its first pre-release — resolve the sibling clone meanwhile.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_notifications"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["django_notifications"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
